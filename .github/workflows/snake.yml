name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate animated snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: holly-soul
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=%2300F0FF
      - name: Publish animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
